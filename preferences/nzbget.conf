# Preference overlay, NOT a complete live configuration.
# Configure UI and Usenet credentials privately before use.
MainDir=/downloads
DestDir=${MainDir}/completed
InterDir=${MainDir}/intermediate
QueueDir=/config/queue
TempDir=${MainDir}/tmp
NzbDir=${MainDir}/nzb
LogFile=/config/logs/nzbget.log
WriteLog=rotate
RotateLog=3
FlushQueue=yes
ArticleCache=256
WriteBuffer=1024
DirectWrite=yes
DownloadRate=0
NzbDirInterval=0
DiskSpace=250
ContinuePartial=yes
Unpack=yes
UnpackPauseQueue=no
DirectUnpack=no
ParCheck=auto
ParRepair=yes
HealthCheck=park
PostStrategy=balanced
Server1.Active=yes
Server1.Level=0
Server1.Host=eu.astraweb.com
Server1.Port=443
Server1.Encryption=yes
Server1.Connections=40
# Hardened public-template defaults; live credentials/settings are not changed.
CertCheck=yes
Server1.CertVerification=Strict
